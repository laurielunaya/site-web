# Envoie automatiquement le site sur Hostinger (FTP) à chaque modification de la branche main.
# Les identifiants sont dans GitHub : Settings > Secrets and variables > Actions
# (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD). Tant qu'ils ne sont pas renseignés, rien n'est envoyé.
name: Déploiement sur Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP_SECRETS: ${{ secrets.FTP_PASSWORD != '' && secrets.FTP_USERNAME != '' && secrets.FTP_SERVER != '' }}
    steps:
      - name: Récupération des fichiers
        uses: actions/checkout@v4

      - name: Versionner le CSS et le JavaScript (évite les anciennes versions en cache)
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(css/style\.css|js/main\.js|js/quiz\.js)\"#\1?v=$V\"#g" *.html
          sed -i "s#'js/noel\.js'#'js/noel.js?v=$V'#" js/main.js
          grep -c "?v=$V" *.html | head -3

      - name: Envoi vers Hostinger
        id: envoi1
        continue-on-error: true
        if: env.HAS_FTP_SECRETS == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            serve.ps1
            README*

      - name: Attente avant un nouvel essai
        if: steps.envoi1.outcome == 'failure'
        run: sleep 45

      - name: Envoi vers Hostinger (2e essai)
        if: steps.envoi1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            serve.ps1
            README*
